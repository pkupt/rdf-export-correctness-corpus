<text x="14" y="55" font-size="11.5" fill="#556">Cell shading is the number of records; darker means more. Generated from corpus_cross_library.csv.</text>
<text x="14" y="72" font-size="11.5" fill="#556">The blank cells show where the corpus is thin, not where the class is absent in the wild (see paper §6.6).</text>
